data:
  root: ../data/algonauts
  subjects: null  
  nsd_expdesign: ../data/algonauts/nsd_expdesign.mat
  image_size: 224
  num_workers: 4
  pin_memory: true

model:
  # Paper defaults:
  embedding_dim: 256
  dino_model: dinov2_vitl14
  dino_layers: [1, 6, 12, 18, 24]
  proj_dim: 256 
  lora_rank: 8
  lora_alpha: 16
  train_backbone: lora
  mlp_hidden_mult: 4

train:
  seed: 42
  device: auto 
  amp: true
  epochs: 20
  lr: 1.0e-3
  weight_decay: 1.0e-3
  batch_images: 32
  voxels_per_image: 5000
  grad_clip_norm: 1.0
  log_every: 20
  val_every: 1
  ckpt_dir: checkpoints
  save_every: 1
  wandb: true
  wandb_project: universal-brain-encoder

eval:
  voxel_chunk: 4096
  batch_images: 8
